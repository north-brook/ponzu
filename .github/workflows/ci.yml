name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Merging into main requires (ruleset "Protect main") the commits, checks and
# desktop package jobs. Each reports on every pull request: a suite a change
# can't affect (scripts/ci/scope.ts) passes without doing its work, rather
# than never reporting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the old head; main keeps every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Builds here are thrown away; Next shouldn't report on them.
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  commits:
    name: Conventional commit messages
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # commitlint is all this needs: the root package, not the workspaces.
      - run: bun install --frozen-lockfile --ignore-scripts --filter ponzu-monorepo
      - name: The PR title becomes the squash commit, which Release Please reads
        if: github.event_name == 'pull_request'
        run: bunx commitlint <<<"$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
      # A feature or fix usually changes something a user notices; its note is
      # what the app's update popover says about it (docs/release-notes.md). Some
      # fixes are invisible, so this warns.
      - name: A feature or fix says what users will notice
        if: github.event_name == 'pull_request'
        run: |
          grep -Eq '^(feat|fix)(\([^)]*\))?!?:' <<<"$TITLE" || exit 0
          grep -Eiq '^#{2,3}[[:space:]]+release notes?[[:space:]]*$' <<<"$BODY" ||
            echo "::warning title=No release note::Add a '## Release note' section to the description if users will notice this change (docs/release-notes.md)."
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}

  scope:
    # Which suites this pull request can affect (scripts/ci/scope.ts). A push
    # to main runs everything. A suite whose scope is unknown runs: the jobs
    # below skip only when this job answered false, so its failing never
    # passes them.
    name: Test scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.scope.outputs.desktop || 'true' }}
      mobile: ${{ steps.scope.outputs.mobile || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request'
        with:
          bun-version-file: package.json
      - id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bun scripts/ci/scope.ts "origin/$BASE_REF" > "$RUNNER_TEMP/scope"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/scope"

  test:
    name: Check, typecheck, test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      # Nothing here needs Electron itself, only its types.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The Chromium the render tests use
        # They skip without one, which would pass with them unrun.
        run: |
          chrome=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          [ -n "$chrome" ] || { echo "::error::No Chrome or Chromium on this runner; the render tests would skip."; exit 1; }
          echo "PONZU_CHROMIUM=$chrome" >> "$GITHUB_ENV"
      - name: Lint, typecheck and build beside the tests
        # None of these writes what another reads. Test files run in their own
        # workers; the Chromium ones take most of the time. Each check's output
        # is printed whole after everything finishes.
        run: |
          check() { name=$1; shift; { "$@" > "$RUNNER_TEMP/$name.log" 2>&1; echo $? > "$RUNNER_TEMP/$name.status"; } & }
          check lint bunx biome check .
          check typecheck bunx tsc -p tsconfig.json --noEmit
          check typecheck-mobile bunx tsc -p apps/mobile/tsconfig.json --noEmit
          check typecheck-desktop bunx tsc -p apps/desktop/tsconfig.json --noEmit
          check studio bun run --filter @ponzu/studio build
          check web bun run --filter @ponzu/web build
          failed=0
          bun test --parallel || failed=1
          wait
          for name in lint typecheck typecheck-mobile typecheck-desktop studio web; do
            echo "::group::$name"
            cat "$RUNNER_TEMP/$name.log"
            echo "::endgroup::"
            if [ "$(cat "$RUNNER_TEMP/$name.status")" != 0 ]; then
              echo "::error title=$name failed::Its output is in the $name group above."
              failed=1
            fi
          done
          exit $failed

  desktop:
    name: Desktop package
    needs: scope
    # Always reports, as the ruleset requires it; a change the package can't
    # see (the phone, the site, prose) passes without building it.
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      RUN: ${{ needs.scope.outputs.desktop != 'false' }}
    steps:
      - name: Out of scope
        if: env.RUN != 'true'
        run: echo "This change can't affect the desktop package (scripts/ci/scope.ts)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.RUN == 'true'
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: env.RUN == 'true'
      - name: Xvfb, for the smoke test
        if: env.RUN == 'true'
        # Alongside the package. Most images already have it; the package
        # index is refreshed only when the install can't find it.
        run: |
          command -v xvfb-run && exit 0
          sudo apt-get install -y --no-install-recommends xvfb ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb; }
      - name: Unsigned, unpublished package
        if: env.RUN == 'true'
        run: bun run package:dir
        working-directory: apps/desktop
      - name: The packaged app starts its server and paints the studio
        if: env.RUN == 'true'
        # A main process that fails to load hangs on Electron's error dialog
        # and trips the timeout; a server or renderer failure exits 1. See
        # src/smoke.ts. The release workflow runs the same check on the
        # signed Mac build before publishing it.
        run: PONZU_SMOKE=1 timeout 120 xvfb-run -a out/linux-unpacked/ponzu --no-sandbox
        working-directory: apps/desktop
      - name: The npm package installs, creates a design and serves the studio
        if: env.RUN == 'true'
        # What the release workflow publishes for `bunx ponzu`, with the studio
        # the package above built.
        run: bun scripts/npm-package.ts && bun scripts/npm-smoke.ts

  desktop-windows:
    # The same unsigned package and launch check as "Desktop package", on
    # Windows. Scoped and always reporting the same way.
    name: Desktop package (Windows)
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUN: ${{ needs.scope.outputs.desktop != 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Out of scope
        if: env.RUN != 'true'
        run: echo "This change can't affect the desktop package (scripts/ci/scope.ts)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.RUN == 'true'
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: env.RUN == 'true'
      - name: The CLI finds an installed app and runs it through its shim
        if: env.RUN == 'true'
        # The tests that need Windows itself; "Check, typecheck, test" runs the rest.
        run: bun test apps/cli/src/host.test.ts -t "on Windows"
      - name: Unsigned, unpublished package
        if: env.RUN == 'true'
        run: bun run package:dir
        working-directory: apps/desktop
      - name: The packaged app starts its server and paints the studio
        if: env.RUN == 'true'
        # As on Linux: a main process that fails to load hangs on Electron's
        # error dialog and trips the timeout; a server or renderer failure
        # exits 1. Windows' own timeout.exe only pauses, so PowerShell waits.
        shell: pwsh
        run: |
          $env:PONZU_SMOKE = "1"
          $app = Start-Process -FilePath out\win-unpacked\Ponzu.exe -PassThru -NoNewWindow
          $null = $app.Handle # Without a handle taken now, ExitCode reads empty.
          if (-not $app.WaitForExit(120000)) {
            Write-Error "The packaged app didn't exit within 120s."
            taskkill /T /F /PID $app.Id
            exit 1
          }
          exit $app.ExitCode
        working-directory: apps/desktop

  mobile-checks:
    # The iPhone app on its own: its typecheck and tests (which "Check,
    # typecheck, test" also runs, with everything), and an iOS export, which
    # proves Metro, NativeWind and every import resolve without a Mac.
    name: Mobile checks
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.mobile != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx tsc -p apps/mobile/tsconfig.json --noEmit
      - run: bun test apps/mobile
      - name: The JavaScript bundle builds for iOS
        run: bunx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
        working-directory: apps/mobile

  mobile-ios:
    # Maestro flows (apps/mobile/maestro) on the iOS Simulator, on the
    # self-hosted Macs. Only pull requests from this repository: a fork's
    # code never runs on them. A job no runner can take waits a day in the
    # queue, so this one runs only once the repository variable MOBILE_IOS is
    # "true", set when the spare-ios runners serve this repository.
    name: Mobile iOS
    needs: scope
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && vars.MOBILE_IOS == 'true'
      && needs.scope.outputs.mobile != 'false'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, spare-ios]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Maestro flows
        # A Debug development client built from this checkout, on the
        # simulator the runner assigns (IOS_SIMULATOR_UDID), against a Ponzu
        # serving the examples and Metro. Xcode, Java and Maestro come with
        # the runner. See apps/mobile/maestro/README.md.
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_OUTPUT: ${{ runner.temp }}/maestro.xml
        run: apps/mobile/maestro/run.sh "${IOS_SIMULATOR_UDID:?the runner assigns a simulator}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: maestro
          path: |
            ${{ runner.temp }}/maestro.xml
            ~/.maestro/tests/
          if-no-files-found: ignore

  mobile:
    # One name for the phone's suites, which reports on every pull request:
    # a part the change can't affect is skipped, and passes.
    name: Mobile
    needs: [scope, mobile-checks, mobile-ios]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.mobile-checks.result }}
          IOS: ${{ needs.mobile-ios.result }}
        run: |
          echo "scope: $SCOPE; checks: $CHECKS; iOS: $IOS"
          [ "$SCOPE" = success ] && [[ "$CHECKS" =~ ^(success|skipped)$ ]] && [[ "$IOS" =~ ^(success|skipped)$ ]]

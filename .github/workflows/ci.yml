name: CI

on:
  # A push tests what a merge made, which no pull request's run saw, and saves the caches
  # that pull requests into that branch restore.
  push:
    branches: [main, cloud]
  pull_request:
  # The pull requests image.yml and claude-code.yml open with GITHUB_TOKEN start no workflows;
  # they dispatch this on the branch instead, and it reports on the head commit as a push
  # would (every suite runs; nothing is cached).
  workflow_dispatch:

permissions:
  contents: read

# Merging into main requires (ruleset "Protect main") the commits, checks and
# desktop package jobs. Each reports on every pull request: a suite a change
# can't affect (scripts/ci/scope.ts) passes without doing its work, rather
# than never reporting.
concurrency:
  # A pull request's runs share a group, and a newer push to it cancels the old head's. A
  # push to a branch is its own group, keyed by commit, and is never cancelled: grouped by
  # branch, a third quick merge would cancel the second's pending run, and when merges come
  # quickly the commit that broke the branch would have no verdict of its own. The two
  # kinds never share a group, so neither cancels the other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Builds here are thrown away; Next shouldn't report on them.
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  commits:
    name: Conventional commit messages
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # commitlint is all this needs: the root package, not the workspaces.
      - run: bun install --frozen-lockfile --ignore-scripts --filter ponzu-monorepo
      - name: The PR title becomes the squash commit, which Release Please reads
        if: github.event_name == 'pull_request'
        run: bunx commitlint <<<"$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
      # A feature or fix usually changes something a user notices; its note is
      # what the app's update popover says about it (docs/release-notes.md). Some
      # fixes are invisible, so this warns.
      - name: A feature or fix says what users will notice
        if: github.event_name == 'pull_request'
        run: |
          grep -Eq '^(feat|fix)(\([^)]*\))?!?:' <<<"$TITLE" || exit 0
          grep -Eiq '^#{2,3}[[:space:]]+release notes?[[:space:]]*$' <<<"$BODY" ||
            echo "::warning title=No release note::Add a '## Release note' section to the description if users will notice this change (docs/release-notes.md)."
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}

  scope:
    # Which suites this pull request can affect (scripts/ci/scope.ts). A push
    # runs everything. A suite whose scope is unknown runs: the jobs
    # below skip only when this job answered false, so its failing never
    # passes them.
    name: Test scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.scope.outputs.desktop || 'true' }}
      mobile: ${{ steps.scope.outputs.mobile || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request'
        with:
          bun-version-file: package.json
      - id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bun scripts/ci/scope.ts "origin/$BASE_REF" > "$RUNNER_TEMP/scope"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/scope"

  checks:
    # Everything but the tests, on its own runner, so none of it shares cores with them: most
    # flaky failures used to come in bun's first minute, while these ran beside it, and a
    # typecheck or lint failure now reports on its own instead of after the tests.
    name: Lint, typecheck, build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The Node the cloud API is served on (its `engines`), which is what loads its bundle
      # below. The runner's own Node is older.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/api/package.json
      # The Linux jobs restore this cache, and only this one saves it, only on a push: jobs
      # no longer race to upload the same 800 MB, and a pull request reads what its base
      # branch saved.
      - id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Saved by each push, so a pull request restores the newest one its base branch built,
      # from an older lockfile if need be. Next discards what no longer matches.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-
      # Nothing here needs Electron itself, only its types.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint, typecheck and build
        # None of these writes what another reads, so they run at once. Each one's output is
        # printed whole after all have finished.
        run: |
          check() { name=$1; shift; { "$@" > "$RUNNER_TEMP/$name.log" 2>&1; echo $? > "$RUNNER_TEMP/$name.status"; } & }
          check lint bunx biome check .
          check typecheck bunx tsc -p tsconfig.json --noEmit
          check typecheck-mobile bunx tsc -p apps/mobile/tsconfig.json --noEmit
          check typecheck-desktop bunx tsc -p apps/desktop/tsconfig.json --noEmit
          check typecheck-api bunx tsc -p apps/api/tsconfig.json --noEmit
          # The shared rules the phone runs, against the language's library with no DOM.
          check typecheck-model bunx tsc -p packages/client/tsconfig.model.json --noEmit
          check studio bun run --filter @ponzu/studio build
          check web bun run --filter @ponzu/web build
          # Builds the API the way Vercel does and loads the bundle in Node.
          check api bun scripts/ci/api-bundle.ts
          # Builds the runner and starts it, which must refuse an empty environment. Its own
          # outdir, so it never overwrites the dist/ the API build reads.
          check runner bun apps/runner/scripts/build.ts --smoke --outdir "$RUNNER_TEMP/runner"
          # Migrations are expand-only: a destructive statement needs a `-- contract:` line.
          check migrations bun scripts/ci/migrations.ts
          wait
          failed=0
          for name in lint typecheck typecheck-mobile typecheck-desktop typecheck-api typecheck-model studio web api runner migrations; do
            echo "::group::$name"
            cat "$RUNNER_TEMP/$name.log"
            echo "::endgroup::"
            if [ "$(cat "$RUNNER_TEMP/$name.status")" != 0 ]; then
              echo "::error title=$name failed::Its output is in the $name group above."
              failed=1
            fi
          done
          exit $failed
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}

  workflows:
    # Every workflow, linted by actionlint with .github/actionlint.yaml (and the runner's
    # shellcheck, for each `run:`). Pinned by version and checksum: it reads only this checkout.
    name: Workflows
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --fail --location --max-time 60 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  tests:
    # The tests alone; "Lint, typecheck, build" runs the rest, and "Check, typecheck, test"
    # reports both.
    name: Tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      # Stripe's official mock server, which checks every request's parameters against Stripe's
      # OpenAPI description: apps/api/src/deps/payments.stripe-mock.test.ts runs the payments seam
      # against it, and is skipped without STRIPE_MOCK_URL. Pinned by digest (v0.206.0). It holds no
      # key and reaches nothing.
      stripe-mock:
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
        ports:
          - 12111:12111
    env:
      # Kept between runs by the cache below, outside the checkout.
      TIMINGS: ~/.cache/ponzu-ci/bun-timings.json
      STRIPE_MOCK_URL: http://localhost:12111
    steps:
      # The tests' watchdog counts its deadline from here, the job's first step.
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # "Lint, typecheck, build" saves it.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # How long each test file took on the newest push, so `--parallel` starts the slowest
      # first instead of whenever it reaches them: the studio's two longest files used to
      # start among the last, and the run ended when they did. A file it doesn't list runs in
      # the usual order, and with no file at all bun runs as it always has.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TIMINGS }}
          key: bun-timings-${{ github.sha }}
          restore-keys: bun-timings-
      # Nothing here needs Electron itself, only its types.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The Chromium the render tests use
        # They skip without one, which would pass with them unrun.
        run: |
          chrome=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          [ -n "$chrome" ] || { echo "::error::No Chrome or Chromium on this runner; the render tests would skip."; exit 1; }
          echo "PONZU_CHROMIUM=$chrome" >> "$GITHUB_ENV"
      - name: The studio the Chromium tests serve, built once
        # Not once in each test file; a stale or missing build fails them (apps/studio/scripts/prebuilt.ts).
        run: |
          bun apps/studio/scripts/prebuild-tests.ts "$RUNNER_TEMP/studio-tests"
          echo "PONZU_PREBUILT_STUDIO=$RUNNER_TEMP/studio-tests" >> "$GITHUB_ENV"
      - name: Tests
        # Test files run in their own workers; the Chromium ones take most of the time. The test
        # databases are made in bun's preload (bunfig.toml), before any test, not inside the first
        # test's timeout. Tests and hooks still get twenty seconds, not bun's default five: that
        # was set before the move, and what else still needs it has not been measured. A push
        # records each file's time for the runs after it. Every test's result also goes to JUnit
        # XML, uploaded below, so which test failed when can be asked of the artifacts rather
        # than the logs.
        #
        # A test that blocks its worker's thread blocks bun's own timeout too, and the run then
        # prints nothing more until the job's limit cancels it; the last file printed is only the
        # last to finish. So bun runs under scripts/ci/test-watchdog.ts: a minute before the
        # job's 10-minute limit (the whole job usually takes two), it names each test file still
        # running and how far it got, prints the process tree, and ends the run, so the upload
        # below still happens. The deadline's minutes are the job's timeout-minutes
        # (workflows.test.ts holds them equal).
        run: |
          timings=${TIMINGS/#\~/$HOME}
          results="$RUNNER_TEMP/test-results"
          mkdir -p "$(dirname "$timings")" "$results"
          deadline=$((JOB_STARTED + 10 * 60 - 60))
          # bun refuses a timings file it can't parse, and every push would then save the same
          # one again, so one bad cache would fail every run after it. Exactly one JSON document
          # of the right shape passes (`-s` reads them all: jq alone would accept two in a row).
          if [ -f "$timings" ] && ! jq -e -s 'length == 1 and (.[0].files | type == "object")' "$timings" > /dev/null 2>&1; then
            echo "::warning title=Timings dropped::The cached test timings aren't valid; this run starts files in bun's usual order."
            rm "$timings"
          fi
          update=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then update=(--update-timings); fi
          status=0
          bun scripts/ci/test-watchdog.ts --deadline "$deadline" --trace "$results/running" -- \
            bun test --parallel --timeout 20000 --timings "$timings" "${update[@]}" \
            --reporter=junit --reporter-outfile="$results/junit.xml" || status=$?
          if [ -f "$timings" ]; then cp "$timings" "$results/"; fi
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          # One per attempt, so a rerun's results sit beside the first's.
          name: test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !cancelled() && github.event_name == 'push' }}
        with:
          path: ${{ env.TIMINGS }}
          key: bun-timings-${{ github.sha }}

  test:
    # Main's ruleset requires this check by its name. It used to run the lint, typecheck,
    # builds and tests in one job; they now run beside each other in the two above, and this
    # passes only when both did, so the required check still fails when any of them does. The
    # workflows' lint is held to it too, so a workflow actionlint rejects cannot merge.
    name: Check, typecheck, test
    needs: [checks, tests, workflows]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: |
          echo "lint, typecheck, build: $CHECKS; tests: $TESTS; workflows: $WORKFLOWS"
          [ "$CHECKS" = success ] && [ "$TESTS" = success ] && [ "$WORKFLOWS" = success ]

  database:
    # The cloud database's migrations and queries on a real Postgres. Every
    # other test runs them on PGlite, which is one connection inside the test
    # process: there two statements never run at once and the planner never
    # sees a table fill up, so a lost race or a claim that ignores its limit
    # passes. packages/db/src/live.ts says what these tests need.
    name: Database on Postgres
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ponzu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ponzu_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Only the database package and what it imports: about 95 MB, against 800 MB for the
      # whole repository, for a second of tests. Its own cache, saved by a push.
      - id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-db-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-db-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts --filter @ponzu/db
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.bun/install/cache
          key: bun-db-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: The migrations apply, and applying them again changes nothing
        run: bun run db:migrate && bun run db:migrate
        working-directory: packages/db
      - name: Races, claims and every kind of statement over real connections
        # These files skip without the variable, which would pass with them unrun.
        run: bun test packages/db/src/queries/*.live.test.ts
        env:
          PONZU_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

  desktop:
    name: Desktop package
    needs: scope
    # Always reports, as the ruleset requires it; a change the package can't
    # see (the phone, the site, prose) passes without building it.
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      RUN: ${{ needs.scope.outputs.desktop != 'false' }}
    steps:
      - name: Out of scope
        if: env.RUN != 'true'
        run: echo "This change can't affect the desktop package (scripts/ci/scope.ts)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.RUN == 'true'
        with:
          bun-version-file: package.json
      # "Lint, typecheck, build" saves it.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: env.RUN == 'true'
      - name: Xvfb, for the smoke test
        if: env.RUN == 'true'
        # Alongside the package. Most images already have it; the package
        # index is refreshed only when the install can't find it.
        run: |
          command -v xvfb-run && exit 0
          sudo apt-get install -y --no-install-recommends xvfb ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb; }
      - name: Unsigned, unpublished package
        if: env.RUN == 'true'
        run: bun run package:dir
        working-directory: apps/desktop
      - name: The packaged studio carries no fake backend
        if: env.RUN == 'true'
        # Ponzu Cloud in memory (fake-host.ts) is in development and e2e builds
        # only, so a release can't run on it whatever PONZU_FAKE_BACKEND says.
        # A studio that isn't where this looks would pass unchecked, so its absence fails too.
        run: |
          test -f out/linux-unpacked/resources/studio/index.html
          if grep -rl "ponzuFake" out/linux-unpacked/resources/studio; then
            echo "The packaged studio has the fake backend in it." >&2
            exit 1
          fi
        working-directory: apps/desktop
      - name: The packaged app draws its sign-in screen
        if: env.RUN == 'true'
        # Signed out, with no keychain and no network. A main process that
        # fails to load hangs on Electron's error dialog and trips the timeout;
        # a studio that fails exits 1. See src/smoke.ts. The release workflow
        # runs the same check on the signed Mac build before publishing it.
        run: PONZU_SMOKE=1 timeout 120 xvfb-run -a out/linux-unpacked/ponzu --no-sandbox
        working-directory: apps/desktop
      - name: Ponzu Dev packages and draws its sign-in screen
        if: env.RUN == 'true'
        # The build that runs beside Ponzu 1.x (src/packaging.ts), so it can't
        # rot between the times someone needs it. Built after the release's
        # check: it rebuilds dist/ as Ponzu Dev's.
        run: |
          bun run package:dev
          PONZU_SMOKE=1 timeout 120 xvfb-run -a out/dev/linux-unpacked/ponzu-dev --no-sandbox
        working-directory: apps/desktop

  desktop-windows:
    # The same unsigned package and launch check as "Desktop package", on
    # Windows. Scoped and always reporting the same way.
    name: Desktop package (Windows)
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 25
    env:
      RUN: ${{ needs.scope.outputs.desktop != 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Out of scope
        if: env.RUN != 'true'
        run: echo "This change can't affect the desktop package (scripts/ci/scope.ts)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.RUN == 'true'
        with:
          bun-version-file: package.json
      # Only this job uses Windows' cache. Saved by a push, like Linux's.
      - id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true'
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        if: env.RUN == 'true'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: env.RUN == 'true' && github.event_name == 'push' && steps.bun-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: The app's own paths, as Windows writes them
        if: env.RUN == 'true'
        # The app's serving of the studio and reading of links with Windows'
        # separators ("Tests" runs the rest).
        run: bun test apps/desktop/src/studio-files.test.ts apps/desktop/src/deep-links.test.ts
      - name: Unsigned, unpublished package
        if: env.RUN == 'true'
        run: bun run package:dir
        working-directory: apps/desktop
      - name: The packaged app draws its sign-in screen
        if: env.RUN == 'true'
        # As on Linux: a main process that fails to load hangs on Electron's
        # error dialog and trips the timeout; a studio that fails exits 1.
        # Windows' own timeout.exe only pauses, so PowerShell waits.
        shell: pwsh
        run: |
          $env:PONZU_SMOKE = "1"
          $app = Start-Process -FilePath out\win-unpacked\Ponzu.exe -PassThru -NoNewWindow
          $null = $app.Handle # Without a handle taken now, ExitCode reads empty.
          if (-not $app.WaitForExit(120000)) {
            Write-Error "The packaged app didn't exit within 120s."
            taskkill /T /F /PID $app.Id
            exit 1
          }
          exit $app.ExitCode
        working-directory: apps/desktop

  mobile-checks:
    # The iPhone app on its own: its typecheck ("Lint, typecheck, build" also
    # runs it) and tests ("Tests" also runs them, with everything), its
    # component tests (jest-expo, `test:rn`), and an iOS export, which proves
    # Metro, NativeWind and every import resolve without a Mac. It runs for
    # every pull request the phone's scope covers, into `cloud` too, where
    # the cloud app is now built (scripts/ci/scope.ts: the phone, the canvas,
    # and the client and core it runs).
    name: Mobile checks
    needs: scope
    if: >-
      ${{ !cancelled() && needs.scope.outputs.mobile != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # "Lint, typecheck, build" saves it.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx tsc -p apps/mobile/tsconfig.json --noEmit
      - run: bun test apps/mobile
      - name: Component tests
        run: bun run test:rn
        working-directory: apps/mobile
      - name: The JavaScript bundle builds for iOS
        run: bunx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
        working-directory: apps/mobile

  mobile-ios:
    # Maestro flows (apps/mobile/maestro) on the iOS Simulator, on spare. Only
    # pull requests from this repository: a fork's code never runs there. A
    # job no runner can take waits a day in the queue, so this one runs only
    # once the repository variable MOBILE_IOS is "true", set when the
    # spare-ios runners serve this repository. Not for pull requests into
    # `cloud`: these flows drive the local app's pairing, which the cloud
    # rewrite replaces, and one runner takes eleven minutes a run, in turn.
    # The phone's own flows come back with its cloud client.
    name: Mobile iOS
    needs: scope
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.base_ref != 'cloud'
      && vars.MOBILE_IOS == 'true'
      && needs.scope.outputs.mobile != 'false'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, macOS, ARM64, spare-ios]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # The network job receives this commit as a Git bundle.
          fetch-depth: 0
      - name: Maestro flows
        # A network iOS job (scripts/ci/mobile-ios.sh): it waits for a
        # pressure-aware iOS permit and a wiped simulator leased from Simlock,
        # shared with the other repositories' jobs and T3. Canceling this step
        # stops the job.
        run: |
          job="spare-gh-ponzu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ios"
          echo "JOB=$job" >> "$GITHUB_ENV"
          network job start spare --repo ponzu --agent command --resource ios \
            --source "$GITHUB_WORKSPACE" --id "$job" -- scripts/ci/mobile-ios.sh
          network job wait "$job" --artifacts-to "$RUNNER_TEMP/$job"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JOB }}
        with:
          name: maestro
          path: ${{ runner.temp }}/${{ env.JOB }}
          if-no-files-found: ignore

  mobile:
    # One name for the phone's suites, which reports on every pull request:
    # a part the change can't affect is skipped, and passes.
    name: Mobile
    needs: [scope, mobile-checks, mobile-ios]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.mobile-checks.result }}
          IOS: ${{ needs.mobile-ios.result }}
        run: |
          echo "scope: $SCOPE; checks: $CHECKS; iOS: $IOS"
          [ "$SCOPE" = success ] && [[ "$CHECKS" =~ ^(success|skipped)$ ]] && [[ "$IOS" =~ ^(success|skipped)$ ]]

name: Release

# Release Please keeps one open release PR per app on main: the desktop app
# and CLI ("chore(main): release X.Y.Z", tags vX.Y.Z) and the iPhone app
# ("chore(main): release mobile X.Y.Z", tags mobile-vX.Y.Z). Every push to
# main enables auto-merge on both, so once CI passes they land, and the next
# run of this workflow tags the version and opens a draft GitHub release with
# its notes. For vX.Y.Z, the mac, windows and linux jobs build Ponzu into that
# draft and launch what they built; the mac job signs and notarizes first.
# Only once all three have succeeded does the publish job check the draft has
# every file each platform's feed names and every download the site links,
# and publish it. A platform that fails leaves the draft a draft, so every
# release ships on all three or on none. The npm job publishes the same
# version of the CLI to npm. electron-updater and the site's download links
# only see the latest published release, so a failed build never reaches
# anyone. A mobile-vX.Y.Z tag starts EAS's production workflow
# (apps/mobile/.eas/workflows), and its release is published here without
# becoming the latest, which stays the desktop app's. A fix or feature merged
# to main reaches installed apps without anyone touching a release PR.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Rebuild an existing release, e.g. after a build-only fix.
      tag:
        description: Existing desktop tag to rebuild (vX.Y.Z). Empty, with publish off, builds the branch run from.
        required: false
        type: string
      # A dry run: build, launch and check every platform, keep the builds as
      # this run's artifacts, and touch no release. Only main may sign the Mac
      # (the release-signing environment), so a dry run from another branch
      # builds Windows and Linux.
      publish:
        description: Upload into the tag's release and publish it
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # A dry run neither waits behind a release nor bumps one waiting its turn.
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('release-dry-run-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Release Please names the root package's outputs plainly and the
    # phone's by its path.
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      mobile_released: ${{ steps.release.outputs['apps/mobile--release_created'] }}
      mobile_tag: ${{ steps.release.outputs['apps/mobile--tag_name'] }}
    steps:
      - name: Require the release token
        run: '[ -n "$RELEASE_TOKEN" ] || { echo "Set the RELEASE_TOKEN repository secret (see CONTRIBUTING.md#releases)"; exit 1; }'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT, not GITHUB_TOKEN: CI must run on the release PR, which the
          # ruleset's required checks gate.
          token: ${{ secrets.RELEASE_TOKEN }}

  # Auto-merge is idempotent: an updated release PR keeps it and merges once
  # its new head is green. Each app's release PR has its own branch.
  auto-merge:
    name: Auto-merge the ${{ matrix.app }} release PR
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        # The branch's component: the root package's name, or the phone's.
        app: [ponzu, mobile]
    steps:
      - name: Enable squash auto-merge on the open release PR
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "release-please--branches--main--components--$APP" \
            --label "autorelease: pending" \
            --json number,autoMergeRequest --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "no open $APP release PR"; exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .autoMergeRequest <<<"$pr")" != "null" ]; then
            echo "auto-merge already enabled on #$number"; exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --auto
          echo "auto-merge enabled on #$number"
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # The phone's release is built by EAS from its tag, which Release Please
  # has already pushed. Its GitHub release only carries the notes: publish
  # it, but never as the latest, which the desktop app's updater and the
  # site's download links read.
  mobile:
    name: Publish the iPhone release notes
    needs: release-please
    if: ${{ needs.release-please.outputs.mobile_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish, not as the latest
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "no release for $TAG"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=false --jq '"published \(.tag_name) \(.html_url)"'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.mobile_tag }}

  # The CLI on npm, which `bunx ponzu` runs: the desktop app's version, from its
  # tag. Built and installed as CI's desktop job does (scripts/npm-package.ts,
  # scripts/npm-smoke.ts), then published unless npm already has that version,
  # so a rebuild by hand is safe. npm trusts this workflow as the package's
  # publisher, or takes the NPM_TOKEN secret (CONTRIBUTING.md#releases).
  npm:
    name: CLI on npm
    needs: release-please
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.released == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(inputs.tag, 'v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Trusted publishing and the provenance statement.
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the package
        run: |
          bun run --filter @ponzu/studio build
          bun scripts/npm-package.ts
        env:
          # As in the Mac app's server: release builds report anonymous usage.
          PONZU_POSTHOG_KEY: ${{ vars.PONZU_POSTHOG_KEY }}
      - name: It installs, creates a design and serves the studio
        run: bun scripts/npm-smoke.ts
      - name: Publish
        run: |
          version=$(jq -r .version apps/cli/npm/package.json)
          if [ "$(npm view "ponzu@$version" version 2>/dev/null)" = "$version" ]; then
            echo "ponzu@$version is already on npm"; exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@11
          npm publish apps/cli/npm --access public --provenance


  # The desktop app, one job per platform, for the root package's release
  # (vX.Y.Z) only: `released` is never set by a phone release, and a mobile-v
  # tag doesn't start with "v". Each builds the tag (a dry run: the branch run
  # from, unless it names a tag), uploads into the draft unless it's a dry run,
  # launches what it built and keeps it as this run's artifact. None publishes:
  # the publish job does, once all three have succeeded.
  mac:
    name: Desktop macOS arm64
    needs: release-please
    # The signing environment takes only main, so a dry run elsewhere skips the Mac.
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.released == 'true'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && (startsWith(inputs.tag, 'v') || !inputs.publish))) }}
    runs-on: macos-15
    # Holds the signing certificate and notarization key; only main may use it.
    environment: release-signing
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          # The app bundles every release's notes, read from
          # main's history between tags (scripts/release-notes.ts).
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The release tooling as this run of the workflow has it: a tag rebuilt by
      # hand can predate it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - run: bun install --frozen-lockfile
      - name: Write the App Store Connect API key
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - name: Build, sign, notarize and upload into the draft release
        run: |
          bun run --filter @ponzu/studio build
          bun run build
          bunx electron-builder --mac --arm64 --publish "$([ "$PUBLISH" = true ] && echo always || echo never)"
        working-directory: apps/desktop
        env:
          # electron-builder imports the base64 p12 into a temporary keychain itself.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_NAME: Northbrook PBC (R9352YFQL4)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
          # Inlined into the bundled server, so release builds report anonymous
          # usage and builds from source don't (apps/cli/src/telemetry.ts).
          PONZU_POSTHOG_KEY: ${{ vars.PONZU_POSTHOG_KEY }}
      - name: Signed, notarized and stapled
        # The app inside the DMG carries the notarization ticket; the DMG
        # itself is only a container and is not notarized.
        run: |
          codesign --verify --deep --strict --verbose=2 out/mac-arm64/Ponzu.app
          codesign --verify --strict --verbose=2 out/mac-arm64/Ponzu.app/Contents/Resources/server/ponzu
          spctl --assess --type execute --verbose=2 out/mac-arm64/Ponzu.app
          xcrun stapler validate out/mac-arm64/Ponzu.app
        working-directory: apps/desktop
      - name: The signed app starts its server and paints the studio
        # The exact bundle in the draft, before the draft goes public. A broken
        # main process hangs on Electron's error dialog and trips the alarm;
        # a server or renderer failure exits 1. See src/smoke.ts. macOS ships
        # no `timeout`; perl's alarm survives exec.
        # ELECTRON_RUN_AS_NODE, if a host sets it, would make the app plain Node.
        run: env -u ELECTRON_RUN_AS_NODE PONZU_SMOKE=1 perl -e 'alarm shift; exec @ARGV' 120 out/mac-arm64/Ponzu.app/Contents/MacOS/Ponzu
        working-directory: apps/desktop
      - name: Upload anything electron-builder didn't
        if: env.PUBLISH == 'true'
        run: bash "$GITHUB_WORKSPACE/release-tools/scripts/release-upload.sh" "$TAG" out/*.dmg out/*.zip out/*.blockmap out/latest-mac.yml
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

  # Unsigned for now: Windows' SmartScreen warns before the first launch. No
  # signing secrets reach this job, so electron-builder signs nothing, and the
  # app's feed names no publisher for the updater to check an update against.
  windows:
    name: Desktop Windows x64
    needs: release-please
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.released == 'true'
      || (github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'v') || !inputs.publish))) }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The release tooling as this run of the workflow has it: a tag rebuilt by
      # hand can predate it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: This tag builds for Windows
        run: jq -e '.build.nsis' apps/desktop/package.json >/dev/null || { echo "::error::$TAG predates Windows builds, so it can't be rebuilt here."; exit 1; }
      - run: bun install --frozen-lockfile
      - name: Build the installer and upload it into the draft release
        run: |
          bun run --filter @ponzu/studio build
          bun run build
          bunx electron-builder --win --x64 --publish "$([ "$PUBLISH" = true ] && echo always || echo never)"
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          PONZU_POSTHOG_KEY: ${{ vars.PONZU_POSTHOG_KEY }}
      - name: The update feed names no publisher to check updates against
        # electron-updater checks a Windows update's signature only against the
        # publisher app-update.yml names, which an unsigned build has none of.
        run: |
          cat out/win-unpacked/resources/app-update.yml
          ! grep -q publisherName out/win-unpacked/resources/app-update.yml
        working-directory: apps/desktop
      - name: The installer installs Ponzu, which starts its server and paints the studio
        # As CI's "Desktop package (Windows)", on what the installer put in
        # place: one click, for this person only, under %LOCALAPPDATA%\Programs.
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath out\Ponzu-x64.exe -ArgumentList '/S' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { Write-Host "::error::The installer exited $($setup.ExitCode)."; exit 1 }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\ponzu\Ponzu.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::The installer put nothing at $exe."; exit 1 }
          $env:PONZU_SMOKE = "1"
          $app = Start-Process -FilePath $exe -PassThru -NoNewWindow
          $null = $app.Handle # Without a handle taken now, ExitCode reads empty.
          if (-not $app.WaitForExit(120000)) {
            taskkill /T /F /PID $app.Id
            Write-Host "::error::The installed app didn't exit within 120s."
            exit 1
          }
          exit $app.ExitCode
        working-directory: apps/desktop
      - name: Uninstalling removes Ponzu and what it wrote for the person
        # What the app writes at launch (src/designs.ts, apps/cli/src/command.ts),
        # which the uninstaller removes through build/uninstall.ps1.
        shell: pwsh
        run: |
          $classes = 'HKCU:\Software\Classes'
          New-Item -Path "$classes\Ponzu.Design\shell\open\command" -Force | Out-Null
          if (-not (Test-Path "$classes\.json\OpenWithProgids")) { New-Item -Path "$classes\.json\OpenWithProgids" -Force | Out-Null }
          New-ItemProperty -Path "$classes\.json\OpenWithProgids" -Name 'Ponzu.Design' -PropertyType None -Value ([byte[]]@()) -Force | Out-Null
          $ponzu = Join-Path $env:USERPROFILE '.ponzu'
          $bin = Join-Path $ponzu 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          [Environment]::SetEnvironmentVariable('Path', ([Environment]::GetEnvironmentVariable('Path', 'User') + ";$bin"), 'User')
          @{ linked = $bin } | ConvertTo-Json | Set-Content (Join-Path $ponzu 'command.json')

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ponzu'
          Start-Process -FilePath (Join-Path $dir 'Uninstall Ponzu.exe') -ArgumentList '/S' -Wait
          # The uninstaller hands over to a copy of itself and returns at once.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path (Join-Path $dir 'Ponzu.exe')) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 1 }

          $failed = @()
          if (Test-Path (Join-Path $dir 'Ponzu.exe')) { $failed += 'Ponzu is still installed.' }
          if (Test-Path "$classes\Ponzu.Design") { $failed += 'The Ponzu Design type is still registered.' }
          if ((Get-Item "$classes\.json\OpenWithProgids").GetValueNames() -contains 'Ponzu.Design') { $failed += "Ponzu is still under design.json's Open with." }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $bin) { $failed += "$bin is still on the PATH." }
          if (Test-Path (Join-Path $ponzu 'command.json')) { $failed += 'command.json still says the PATH has it.' }
          $failed | ForEach-Object { Write-Host "::error::$_" }
          if ($failed) { exit 1 }
          Write-Host 'Uninstalled, and what Ponzu wrote for the person went with it.'
      - name: Upload anything electron-builder didn't
        if: env.PUBLISH == 'true'
        run: bash "$GITHUB_WORKSPACE/release-tools/scripts/release-upload.sh" "$TAG" out/Ponzu-x64.exe out/Ponzu-x64.exe.blockmap out/latest.yml
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: |
            apps/desktop/out/Ponzu-x64.exe
            apps/desktop/out/Ponzu-x64.exe.blockmap
            apps/desktop/out/latest.yml
          if-no-files-found: error
          retention-days: 30

  # The AppImage and the .deb, both updating in place: the AppImage replaces
  # its own file, the .deb installs the next through dpkg.
  linux:
    name: Desktop Linux x64
    needs: release-please
    if: >-
      ${{ !cancelled() && (needs.release-please.outputs.released == 'true'
      || (github.event_name == 'workflow_dispatch' && (startsWith(inputs.tag, 'v') || !inputs.publish))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The release tooling as this run of the workflow has it: a tag rebuilt by
      # hand can predate it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: This tag builds for Linux
        run: jq -e '.build.appImage' apps/desktop/package.json >/dev/null || { echo "::error::$TAG predates Linux builds, so it can't be rebuilt here."; exit 1; }
      - run: bun install --frozen-lockfile
      - name: Xvfb and FUSE, for the launches
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libfuse2t64
      - name: Build the AppImage and the .deb and upload them into the draft release
        run: |
          bun run --filter @ponzu/studio build
          bun run build
          bunx electron-builder --linux --x64 --publish "$([ "$PUBLISH" = true ] && echo always || echo never)"
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          PONZU_POSTHOG_KEY: ${{ vars.PONZU_POSTHOG_KEY }}
      - name: The AppImage starts its server and paints the studio
        # As CI's "Desktop package", through the AppImage's own runtime. Its
        # icons are where the app's desktop entry finds them (src/designs.ts).
        run: |
          cat out/latest-linux.yml
          chmod +x out/Ponzu-x64.AppImage
          PONZU_SMOKE=1 timeout 120 xvfb-run -a out/Ponzu-x64.AppImage --no-sandbox
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/apps/desktop/out/Ponzu-x64.AppImage" --appimage-extract >/dev/null)
          ls "$RUNNER_TEMP/squashfs-root/usr/share/icons/hicolor"
          test -f "$RUNNER_TEMP/squashfs-root/usr/share/icons/hicolor/512x512/apps/ponzu.png"
          test -f "$RUNNER_TEMP/squashfs-root/resources/app-update.yml"
        working-directory: apps/desktop
      - name: The .deb installs, starts, and removes itself and the wake helper
        # Installed with its dependencies, launched from where it links
        # `ponzu`. The wake helper's units are written as the app writes them
        # at launch; the runner has no systemd user session, so only the files
        # are there to remove (build/deb-after-remove.sh).
        run: |
          sudo apt-get install -y ./out/Ponzu-x64.deb
          test "$(readlink -f /usr/bin/ponzu)" = /opt/Ponzu/ponzu
          test -f /usr/share/icons/hicolor/512x512/apps/ponzu.png
          grep '^Icon=ponzu$' /usr/share/applications/ponzu.desktop
          PONZU_SMOKE=1 timeout 120 xvfb-run -a ponzu --no-sandbox
          /opt/Ponzu/resources/server/ponzu wake install || true
          test -f ~/.config/systemd/user/ponzu-wake@.service
          sudo apt-get remove -y "$(dpkg-deb -f out/Ponzu-x64.deb Package)"
          test ! -e /opt/Ponzu/ponzu
          test ! -e /usr/bin/ponzu
          test ! -e ~/.config/systemd/user/ponzu-wake@.service
          test ! -e ~/.config/systemd/user/ponzu-wake.socket
        working-directory: apps/desktop
      - name: Upload anything electron-builder didn't
        if: env.PUBLISH == 'true'
        run: bash "$GITHUB_WORKSPACE/release-tools/scripts/release-upload.sh" "$TAG" out/Ponzu-x64.AppImage out/Ponzu-x64.deb out/latest-linux.yml
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64
          path: |
            apps/desktop/out/Ponzu-x64.AppImage
            apps/desktop/out/Ponzu-x64.deb
            apps/desktop/out/latest-linux.yml
          if-no-files-found: error
          retention-days: 30

  # The one gate: only once every platform built and launched. It adds the
  # release's notes, which an app about to update shows in its title bar
  # (docs/release-notes.md), downloads the draft as it would be published, and
  # checks it has every file each feed names, unchanged, and every download the
  # site links by name (scripts/release-assets.ts), before publishing it. A dry
  # run checks its artifacts the same way, for the platforms it built.
  publish:
    name: Publish the desktop release
    needs: [release-please, mac, windows, linux]
    if: >-
      ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success'
      && (needs.mac.result == 'success'
      || (needs.mac.result == 'skipped' && github.event_name == 'workflow_dispatch' && !inputs.publish)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      MAC: ${{ needs.mac.result == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The release tooling as this run of the workflow has it: a tag rebuilt by
      # hand can predate it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: The release's notes
        run: bun scripts/release-notes.ts "$RUNNER_TEMP/release-notes.json"
      - name: Upload the notes and download the draft
        if: env.PUBLISH == 'true'
        run: |
          bash release-tools/scripts/release-upload.sh "$TAG" "$RUNNER_TEMP/release-notes.json"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Gather the dry run's builds
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Every platform's feed, files and downloads are there
        run: |
          [ "$PUBLISH" = true ] || cp "$RUNNER_TEMP/release-notes.json" "$RUNNER_TEMP/release/"
          platforms=(windows linux)
          [ "$MAC" = true ] && platforms=(mac "${platforms[@]}")
          version=$(jq -r .version apps/desktop/package.json)
          bun release-tools/scripts/release-assets.ts "$RUNNER_TEMP/release" "$version" "${platforms[@]}"
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "no release for $TAG"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=true --jq '"published \(.tag_name) \(.html_url)"'
        env:
          GH_TOKEN: ${{ github.token }}

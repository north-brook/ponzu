name: Deploy API

# The only thing that deploys apps/api: one Vercel project, ponzu-api, with two environments
# (docs/production.md, "One project, two environments"). One run is the whole staged procedure,
# in order, for the commit it was started for, and a failure anywhere stops what follows it
# (docs/production.md, "The production deploy, staged"):
#
# 1. `plan`: does this commit change what the API is made from (scripts/ci/api-paths.ts), since
#    the commit each environment serves? If not, nothing deploys. An environment already serving
#    a newer commit is never sent an older one.
# 2. `dev`: migrate the Neon `dev` branch, deploy with `--environment dev` (never `--prod`), then
#    check: health names this commit, its image and every migration; the selfcheck passes apart
#    from what is known on dev (scripts/ci/selfcheck.ts); and, when its secrets exist, the canary
#    runs a real turn as the check account (scripts/ci/canary.ts), or says it did not.
# 3. `production`, only after dev passed: record the deployment serving api.ponzu.design, snapshot
#    and migrate the Neon default branch, deploy with `--prod --skip-domain`, check that
#    deployment on its own address, promote it, check api.ponzu.design and the `minute`
#    schedule. If anything fails after the promotion, the deployment recorded first is promoted
#    back (never a bare `vercel rollback`) and checked. The database is left as migrated:
#    migrations are expand only, so the old code runs on the new schema.
# 4. `report`: the run's summary says what is live where, and one issue labelled
#    `deploy-failed` is opened or added to on a failure, and closed by a deploy that succeeds.
#
# Serialized, never cancelled: the whole workflow is one concurrency group. A second merge waits
# for the first run to finish, rollback included. GitHub keeps one run waiting: a third merge
# replaces the waiting one, which is then never run. That skips no migration: the newest run's
# plan compares with what is live, and its `db:migrate` applies every migration in its journal,
# which holds every older commit's.
#
# Off until the repository variable API_DEPLOY is "true" (nothing runs, not even the plan).
# Production also needs API_DEPLOY_PRODUCTION "true", and runs only for a push: it can't deploy
# without dev having passed for the same commit in the same run. Both run only from `main`.
#
# Production's Vercel token is a secret with its own name, VERCEL_TOKEN_PRODUCTION, held only by
# the `production` environment: an environment secret only overrides a repository secret of the
# same name, so a `production` environment without its own VERCEL_TOKEN would silently use the
# repository's, which reaches the same project. A missing one reads as empty, and the job stops
# before it touches the database.
#
# The staged check reads the new deployment's generated *.vercel.app address, which Vercel
# Authentication protects, with a Protection Bypass for Automation secret the founder makes on
# purpose (VERCEL_AUTOMATION_BYPASS_SECRET, in the `production` environment). It does not use
# `vercel curl`, `httpstat` or `deploy --verify`: given no secret, the CLI 65.14.0 creates one on a
# project that has none (read from its code, not tried live). health.ts sends the secret only to
# a *.vercel.app address.
#
# `vercel promote`, `vercel rollback` and `vercel alias set` appear only in the production job.
# Promoting a deployment that is not a production build "will result in a new production
# deployment" (https://vercel.com/docs/cli/promote), and with `--json` and no `--yes` the CLI
# refuses that and exits 1 (read from its code), so neither promotion here can rebuild anything.
# Dev is taken back by deploying an older commit with `--environment dev`.
#
# The repository is deliberately not connected to the Vercel project; this deploys with the CLI
# and a token. scripts/ci/workflows.test.ts holds the shape of this file and runs its steps'
# shell against fakes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run at a time, in order, for the whole chain: never two deploys at once, and never one
  # cancelled halfway through a migration or a rollback.
  group: deploy-api
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: >-
      ${{ vars.API_DEPLOY == 'true' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # main's whole history, to compare this commit with the ones that are live.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # deploy-plan.ts imports nothing outside the repository, so nothing is installed.
      - name: Does this commit change what the API is made from?
        id: plan
        env:
          PRODUCTION_ON: ${{ vars.API_DEPLOY_PRODUCTION == 'true' && github.event_name == 'push' }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--commit "$GITHUB_SHA")
          if [ "$PRODUCTION_ON" = true ]; then args+=(--production); fi
          if [ "$DISPATCH" = true ]; then args+=(--always); fi
          bun scripts/ci/deploy-plan.ts "${args[@]}"

  dev:
    name: Migrate, deploy and check dev
    needs: plan
    if: ${{ needs.plan.outputs.deploy == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The canary's real turn waits for the sandbox's idle window (five minutes on dev).
    timeout-minutes: 45
    # Only `main` may use it (infra/github/repo.json). It holds dev's own VERCEL_TOKEN once the
    # founder puts one there (until then `secrets.VERCEL_TOKEN` is the repository's), dev's
    # CRON_SECRET, and CANARY_SESSION_WRITER.
    environment: dev
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The dev environment holds its cron secret
        # Before anything touches the database: without it dev can't be checked.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "::error::The dev environment has no CRON_SECRET."; exit 1; }
      - name: Apply pending migrations to the Neon `dev` branch
        # Before the code that needs them. `db:migrate` applies everything pending in one
        # transaction and fails if a migration in the journal was passed over.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          url="$(bun apps/api/scripts/neon.ts dev --direct)"
          echo "::add-mask::$url"
          cd packages/db && DATABASE_URL="$url" bun run db:migrate
      - name: Deploy to ponzu-api's dev environment
        # The project's Root Directory is apps/api, so this runs at the repository root. The
        # CLI is pinned: it runs with a token that can deploy. `--environment dev` is the custom
        # environment, with its own variables and api-dev.ponzu.design. Never `--prod`.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@65.14.0 deploy --environment dev --yes --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA"
      - name: Dev answers with this commit, its image and every migration
        # At dev's apiUrl in infra/environments.json, https://api-dev.ponzu.design.
        run: bun scripts/ci/health.ts --env dev --commit "$GITHUB_SHA"
      - name: Dev's selfcheck passes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bun scripts/ci/selfcheck.ts --env dev
      - name: A real turn on dev, as the check account
        id: canary
        # Skipped with a notice when CANARY_SESSION is not set. The session's refresh token
        # rotates, so it runs only when the next step can store the rotated one.
        env:
          CANARY_SESSION: ${{ secrets.CANARY_SESSION }}
          CANARY_CAN_SAVE: ${{ secrets.CANARY_SESSION_WRITER != '' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bun scripts/ci/canary.ts --session-file "$RUNNER_TEMP/canary-session.json"
      - name: Keep the check account's rotated session
        # Whether the canary passed or not: once it has refreshed, only the new token works.
        if: ${{ always() && steps.canary.outputs.ran == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CANARY_SESSION_WRITER }}
        run: |
          gh secret set CANARY_SESSION --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/canary-session.json"
          rm -f "$RUNNER_TEMP/canary-session.json"

  production:
    name: Migrate, deploy and check production
    needs: [plan, dev]
    # A push to main only, never a dispatch, and only once dev has passed for this commit.
    if: >-
      ${{ vars.API_DEPLOY_PRODUCTION == 'true' && github.event_name == 'push'
      && github.ref == 'refs/heads/main' && needs.dev.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      # The same project as dev: its Production target is production.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
    outputs:
      previous_commit: ${{ steps.serving.outputs.commit }}
      rollback: ${{ steps.rollback.outcome }}
      restored: ${{ steps.restored.outcome }}
      rollback_minute: ${{ steps.rollback_minute.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The production environment holds its own token and the bypass
        # Before anything touches the database. A secret the environment lacks reads as empty.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::The production environment has no VERCEL_TOKEN_PRODUCTION."; exit 1; }
          [ -n "$BYPASS" ] || { echo "::error::The production environment has no VERCEL_AUTOMATION_BYPASS_SECRET."; exit 1; }
      - name: Record the deployment serving production now
        id: serving
        # The way back, read before anything changes: its URL and the commit it answers. No
        # deploy goes ahead without one.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: bun scripts/ci/production.ts serving
      - name: Snapshot the Neon default branch
        # pre-<first 12 of the commit>, kept 14 days: the restore point if this migration goes
        # wrong (docs/production.md, "Backups and restore").
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PONZU_ALLOW_DEFAULT_BRANCH: production
        run: bun apps/api/scripts/neon.ts --default --snapshot "pre-${GITHUB_SHA:0:12}"
      - name: Apply pending migrations to the Neon default branch
        # neon.ts refuses the default branch unless PONZU_ALLOW_DEFAULT_BRANCH is "production",
        # which only this job sets.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PONZU_ALLOW_DEFAULT_BRANCH: production
        run: |
          url="$(bun apps/api/scripts/neon.ts --default --direct)"
          echo "::add-mask::$url"
          cd packages/db && DATABASE_URL="$url" bun run db:migrate
      - name: Deploy to the Production target, without its domain
        id: deploy
        # --skip-domain builds a production deployment but leaves api.ponzu.design on the one
        # before it (https://vercel.com/docs/cli/deploy). The CLI writes only the new
        # deployment's URL to stdout.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          bunx vercel@65.14.0 deploy --prod --skip-domain --yes --env VERCEL_GIT_COMMIT_SHA="$GITHUB_SHA" > "$RUNNER_TEMP/deployment-url"
          url="$(tail -n 1 "$RUNNER_TEMP/deployment-url")"
          [[ "$url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]] || { echo "::error::The deploy printed no deployment URL."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: The new deployment answers with this commit, its image and every migration
        # Its generated address, through Vercel Authentication with the bypass secret.
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun scripts/ci/health.ts --env production --commit "$GITHUB_SHA" --url "$URL" --bypass
      - name: Promote it to api.ponzu.design
        id: promote
        # No --yes: promoting a deployment that is not a production build would build a new one
        # with production's variables, and with --json and no --yes the CLI refuses that and
        # exits 1 (read from the CLI 65.14.0's own promote code).
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: bunx vercel@65.14.0 promote "$URL" --json --timeout 5m
      - name: Production answers with this commit, its image and every migration
        run: bun scripts/ci/health.ts --env production --commit "$GITHUB_SHA"
      - name: The minute is active in production
        # "Promote a staged production build: synced from the promoted deployment"
        # (https://vercel.com/docs/schedules/concepts), so this polls for up to two minutes.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: bun scripts/ci/schedules.ts --environment production --name minute --path /v1/cron/minute
      - name: Put back the deployment that was serving
        id: rollback
        # Only when something failed once the promotion had started (a promotion that failed
        # may still have moved the domain). The URL recorded before, never a bare rollback.
        if: ${{ failure() && steps.serving.outcome == 'success' && steps.promote.outcome != 'skipped' }}
        env:
          PREVIOUS_URL: ${{ steps.serving.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: |
          echo "::error title=Rolling production back::The new deployment failed after its promotion; promoting the one that was serving."
          bunx vercel@65.14.0 promote "$PREVIOUS_URL" --json --timeout 5m
      - name: Production answers as it did before
        id: restored
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        env:
          PREVIOUS_COMMIT: ${{ steps.serving.outputs.commit }}
        run: bun scripts/ci/production.ts restored --commit "$PREVIOUS_COMMIT"
      - name: The minute is active after the rollback
        id: rollback_minute
        # A deployment from before the schedule would delete it, and with Disable Cron Jobs on,
        # production would have no minute (docs/production.md, "The minute").
        if: ${{ failure() && steps.rollback.outcome == 'success' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PRODUCTION }}
        run: bun scripts/ci/schedules.ts --environment production --name minute --path /v1/cron/minute

  report:
    name: Report
    needs: [plan, dev, production]
    # Whatever happened before, once the plan ran.
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # The run's jobs and steps, to name the one that failed.
      actions: read
      # The pull request that merged as this commit.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # deploy-report.ts imports nothing outside the repository, so nothing is installed.
      - name: Say what is live where, and open, add to or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.result }}
          DEPLOY: ${{ needs.plan.outputs.deploy }}
          DEV: ${{ needs.dev.result }}
          PRODUCTION_ON: ${{ vars.API_DEPLOY_PRODUCTION == 'true' && github.event_name == 'push' }}
          PRODUCTION: ${{ needs.production.result }}
          ROLLBACK: ${{ needs.production.outputs.rollback }}
          RESTORED: ${{ needs.production.outputs.restored }}
          ROLLBACK_MINUTE: ${{ needs.production.outputs.rollback_minute }}
          PREVIOUS_COMMIT: ${{ needs.production.outputs.previous_commit }}
        run: bun scripts/ci/deploy-report.ts

name: Production

# Fires when Release Please tags a phone release (mobile-vX.Y.Z, when the
# "release mobile" PR merges on main). iOS only. A release that changed
# native code (a new native fingerprint) builds a binary and sends it to
# TestFlight's external Alpha group for Beta App Review; the internal Team
# group distributes every build automatically, so it isn't named here (EAS
# says to name only internal groups that don't). Any other release ships
# over the air to the binaries already installed. This is the phone's only
# lane: every TestFlight build is a production build (shared.yml only
# publishes updates for the packages the phone bundles). A store build
# therefore carries the JavaScript of the last native release, and its
# first launch fetches the current release behind the splash
# (apps/mobile/lib/first-launch.ts), so a new install still starts on
# current code. Can also be re-run by hand with `eas workflow:run
# production.yml`. Before upload succeeds, a failed submission can use
# EAS's "Re-run from failed jobs" with the same binary. After upload
# succeeds, recover with a TestFlight job's asc_build_id instead: retrying
# build_id uploads again, which Apple rejects as a duplicate. A full rerun
# finds the existing build and publishes an update; it does not retry
# submission. See
# https://docs.expo.dev/eas/workflows/pre-packaged-jobs/#testflight.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch: {}

# The Bun package.json pins (`packageManager`); the image's own Bun writes a
# different lockfile, and a frozen install then refuses it. Every job's
# install uses this one, builds included.
defaults:
  tools:
    bun: 1.4.4

jobs:
  fingerprint:
    type: fingerprint
    environment: production
  ios_build_exists:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_ios:
    needs: [ios_build_exists]
    if: ${{ !needs.ios_build_exists.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  # TestFlight's What to Test is this release's notes, read from main's
  # history (scripts/release-notes.ts --phone, docs/release-notes.md).
  # eas/checkout fetches only the tagged commit, so the history is fetched
  # first; without it, or without notes, testers get the generic line below.
  # The script needs no packages, so nothing is installed.
  notes:
    needs: [ios_build_exists]
    if: ${{ !needs.ios_build_exists.outputs.build_id }}
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      changelog: ${{ steps.notes.outputs.changelog }}
    steps:
      - uses: eas/checkout
      - name: This release's notes
        id: notes
        working_directory: ../..
        run: |
          git fetch --quiet --unshallow --tags origin || true
          set-output changelog "$(bun scripts/release-notes.ts --phone "$TAG" || true)"
  submit_ios:
    needs: [build_ios, notes]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      external_groups: ["Alpha"]
      submit_beta_review: true
      changelog: ${{ needs.notes.outputs.changelog || 'Bug fixes and improvements.' }}
  update_ios:
    needs: [ios_build_exists]
    if: ${{ needs.ios_build_exists.outputs.build_id }}
    type: update
    environment: production
    params:
      # The channel its builds listen on (eas.json), not a branch: an update on
      # a branch no channel points at reaches no phone.
      channel: production
      platform: ios
    hooks:
      after_update:
        # Native builds upload Hermes source maps from Xcode; an update has
        # to do it here, where the exported dist/ still exists.
        - uses: eas/posthog_upload_sourcemaps

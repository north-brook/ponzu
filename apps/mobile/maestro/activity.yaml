appId: design.ponzu.app
name: activity
tags: [dev-host]
---
# The Activity tab, then back to Designs by its tab. No development warning along the way.
- runFlow: shared/start.yaml
- tapOn:
    id: tab-activity
- extendedWaitUntil:
    visible:
      id: activity
    timeout: 10000
- assertVisible: "Activity"
# One list with a filter, New by default. Everything, from its menu, puts a
# count on the button; New again clears it. What's new (run.sh's agent added
# three artboards) shows as a row; with nothing new, it says you're caught up.
- assertVisible: "Filter"
- tapOn: "Filter"
- tapOn: "Everything"
- extendedWaitUntil:
    visible: "Filter, 1 on"
    timeout: 5000
- tapOn: "Filter, 1 on"
- tapOn: "New"
- extendedWaitUntil:
    visible: "Filter"
    timeout: 5000
- runFlow:
    when:
      visible:
        id: activity-empty-caughtUp
    commands:
      - assertVisible:
          id: activity-show-everything
- assertNotVisible: ".*Cannot update a component.*"
- tapOn:
    id: tab-designs
- extendedWaitUntil:
    visible:
      id: designs
    timeout: 10000
# And with ?since=, which shows what's new since then: run.sh's agent (agent.ts)
# added three artboards to a design, which the Mac's history names, with their thumbnails.
- openLink: ponzu://activity?since=1
- extendedWaitUntil:
    visible:
      id: activity
    timeout: 10000
# A row reads as one element: its title, when, then where: the file and each
# page, each with its icon, a "·" between.
- extendedWaitUntil:
    visible: "Claude added 3 artboards.*Maestro, ·, Home.*"
    timeout: 20000
- assertVisible:
    id: activity-where
- assertVisible:
    id: activity-thumbs
- assertNotVisible: ".*Cannot update a component.*"
# It opens the design focused on the first of them: the board has the
# screen, its label and the canvas's bar out of the way until a finger moves.
- tapOn: "Claude added 3 artboards.*"
- extendedWaitUntil:
    visible:
      id: canvas
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: title
    timeout: 20000
- swipe:
    start: "50%,60%"
    end: "50%,45%"
    duration: 800
- assertNotVisible:
    id: tab-designs
- assertNotVisible: ".*Cannot update a component.*"

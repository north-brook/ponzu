appId: design.ponzu.app
name: activity
tags: [dev-host]
---
# The Activity tab, then back to Designs by its tab. No development warning along the way.
- runFlow: shared/start.yaml
# run.sh's agent added three artboards, which is new: the tab's badge says so.
- extendedWaitUntil:
    visible: "Activity, 1 new"
    timeout: 20000
- tapOn:
    id: tab-activity
- extendedWaitUntil:
    visible:
      id: activity
    timeout: 10000
- assertVisible: "Activity"
# Looking at it clears it: a moment on screen and its dot fades, the badge drops,
# and the row stays where it is while Activity is in front.
- extendedWaitUntil:
    notVisible:
      id: activity-unread
    timeout: 5000
- assertVisible: "Activity"
- assertNotVisible: "Activity, 1 new"
- assertVisible: "Claude added 3 artboards.*"
# Back to the tab: what was seen is gone, and it's caught up.
- tapOn:
    id: tab-designs
- tapOn:
    id: tab-activity
- extendedWaitUntil:
    visible:
      id: activity-empty-caughtUp
    timeout: 5000
- assertNotVisible: "Claude added 3 artboards.*"
# One list with a filter, New by default. Everything, from its menu, puts a
# count on the button and shows the seen row again; New again clears it.
- assertVisible: "Filter"
- tapOn: "Filter"
- tapOn: "Everything"
- extendedWaitUntil:
    visible: "Filter, 1 on"
    timeout: 5000
- assertVisible: "Claude added 3 artboards.*"
- tapOn: "Filter, 1 on"
- tapOn: "New"
- extendedWaitUntil:
    visible: "Filter"
    timeout: 5000
- assertVisible:
    id: activity-show-everything
- assertNotVisible: ".*Cannot update a component.*"
- tapOn:
    id: tab-designs
- extendedWaitUntil:
    visible:
      id: designs
    timeout: 10000
# And with ?since=, which shows what's new since then: run.sh's agent (agent.ts)
# added three artboards to a design, which the Mac's history names, with their thumbnails.
- openLink: ponzu://activity?since=1
- extendedWaitUntil:
    visible:
      id: activity
    timeout: 10000
# A row reads as one element: its title, when, then where: the file and each
# page, each with its icon, a "·" between.
- extendedWaitUntil:
    visible: "Claude added 3 artboards.*Maestro, ·, Home.*"
    timeout: 20000
- assertVisible:
    id: activity-where
- assertVisible:
    id: activity-thumbs
- assertNotVisible: ".*Cannot update a component.*"
# It opens the design focused on the first of them: the board has the
# screen, its label and the canvas's bar out of the way until a finger moves.
- tapOn: "Claude added 3 artboards.*"
- extendedWaitUntil:
    visible:
      id: canvas
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: title
    timeout: 20000
- swipe:
    start: "50%,60%"
    end: "50%,45%"
    duration: 800
- assertNotVisible:
    id: tab-designs
- assertNotVisible: ".*Cannot update a component.*"

appId: design.ponzu.app.dev
---
# The development client, onto this checkout's JavaScript from Metro
# (DEV_CLIENT: exp+ponzu://expo-development-client/?url=<Metro, encoded>).
# Its menu shows on a first open; close it. The microphone and speech
# recognition are refused up front, so no system prompt gets in the way.
- launchApp:
    permissions:
      microphone: deny
      speech: deny
# A fresh simulator confirms the first link into an app ("Open in “Ponzu
# Dev”?", curly quotes, so `.` matches them); the alert outlives the app and
# blocks every later flow. The launcher can miss a link that lands while it
# starts, so a link that loads nothing is sent again.
- retry:
    maxRetries: 2
    commands:
      - openLink: ${DEV_CLIENT}
      - runFlow:
          when:
            visible: "Open in .Ponzu Dev.\\?"
          commands:
            - tapOn: Open
      - extendedWaitUntil:
          visible:
            id: "(launch|sign-in|canvases|xmark)"
          timeout: 60000
- runFlow:
    when:
      visible:
        id: xmark
    commands:
      - tapOn:
          id: xmark

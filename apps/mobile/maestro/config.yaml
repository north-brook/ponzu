# Flows run in this order: a fresh launch first, then signing in, then setup,
# then the canvases list, then a new canvas, then a canvas, its comments and
# its chat, needs you and the pull request, then the list's filter (which
# ends with it cleared), then pings.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - launch
    - sign-in
    - setup
    - canvases
    - new-canvas
    - canvas
    - comment
    - comment-modes
    - chat
    - needs-you
    - pull-request
    - filter
    - pings

# Flows run in this order: a fresh launch first, then signing in, then setup,
# then the canvases list, then a new canvas, then a canvas, its comments and
# its chat.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - launch
    - sign-in
    - setup
    - canvases
    - new-canvas
    - canvas
    - comment
    - comment-modes
    - chat
    - needs-you

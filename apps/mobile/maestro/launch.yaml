appId: design.ponzu.app.dev
name: launch
---
# A clean install: the slice and wordmark on yuzu while the app reads the
# Keychain, then sign in, since nobody is. The rest of the flows start from
# where this leaves the app.
- launchApp:
    clearState: true
    permissions:
      microphone: deny
      speech: deny
- runFlow: shared/start.yaml
- openLink: ponzu-dev://dev?seed=signed-out
# iOS asks again for each scheme: this one is ponzu-dev://.
- runFlow:
    when:
      visible: "Open in .Ponzu Dev.\\?"
    commands:
      - tapOn: Open
# The launch screen shows only while the bloom lands, about a second: when
# the flow catches it, its wordmark.
- runFlow:
    when:
      visible:
        id: launch
    commands:
      - assertVisible: ponzu
- extendedWaitUntil:
    visible:
      id: sign-in
    timeout: 30000
- assertVisible: "Sign in to Ponzu"
- assertVisible: "Continue with GitHub"
# A link for the production app is refused here, and opens nothing.
- openLink: ponzu-dev://open?mac=studio&file=/x.design
- assertVisible:
    id: sign-in
- assertNotVisible: ".*Cannot update a component.*"

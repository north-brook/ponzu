appId: design.ponzu.app
name: launch
tags: [dev-host]
---
# A first launch: every Mac forgotten, the slice on yuzu and the wordmark
# while Ponzu looks for one. In development the dev host pairs itself
# again on the next launch; here it stays forgotten, so launch goes on to
# the code on your Mac, by way of Tailscale when it's off.
# From a clean install. The rest of the flows start from where this leaves the app.
- launchApp:
    clearState: true
    permissions:
      microphone: deny
      speech: deny
- runFlow: shared/start.yaml
- openLink: ponzu://dev?forget=all
# The launch screen shows only while the bloom lands and Ponzu looks, about a
# second: when the flow catches it, its slice and wordmark.
- runFlow:
    when:
      visible:
        id: launch
    commands:
      - assertVisible: Ponzu
# The simulator shares this Mac's interfaces: with Tailscale on here, launch
# goes straight to the code; without it, to Tailscale, which "Already on?
# Continue" passes.
- extendedWaitUntil:
    visible: "Scan the code on your computer.|Turn on Tailscale on this iPhone."
    timeout: 30000
- runFlow:
    when:
      visible:
        id: tailscale
    commands:
      - extendedWaitUntil:
          visible:
            id: tailscale-continue
          timeout: 10000
      - tapOn:
          id: tailscale-continue
- extendedWaitUntil:
    visible:
      id: connect
    timeout: 10000
- assertVisible: "Scan the code on your computer."
- assertNotVisible: ".*Cannot update a component.*"

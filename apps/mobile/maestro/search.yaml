appId: design.ponzu.app
name: search
tags: [dev-host]
---
# The search tab opens on the system's search field, over the designs changed
# lately; "weft" finds the design by name and its frames by design: both
# sections show.
- runFlow: shared/start.yaml
- tapOn:
    id: tab-search
- extendedWaitUntil:
    visible:
      id: search
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: search-before
    timeout: 10000
# The field focuses itself just after the tab opens: typing waits for it.
# Some simulators never report the field's focus to Maestro, so this wait
# is optional; the results below fail if the typing went nowhere.
- extendedWaitUntil:
    visible:
      focused: true
    timeout: 10000
    optional: true
- inputText: "weft"
- extendedWaitUntil:
    visible:
      id: search-files
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: search-frames
    timeout: 10000
- assertNotVisible: ".*Cannot update a component.*"
# The field closes with its ✕; then Designs by its tab.
- tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: tab-designs
    timeout: 10000
- tapOn:
    id: tab-designs
- extendedWaitUntil:
    visible:
      id: designs
    timeout: 10000

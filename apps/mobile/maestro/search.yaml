appId: design.ponzu.app
name: search
tags: [dev-host]
---
# The search tab opens on the system's search field, over the designs changed
# lately; "brand" finds designs by name and frames by page: both sections show.
- runFlow: shared/start.yaml
- tapOn:
    id: tab-search
- extendedWaitUntil:
    visible:
      id: search
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: search-before
    timeout: 10000
# The field focuses itself just after the tab opens: typing waits for it.
- extendedWaitUntil:
    visible:
      focused: true
    timeout: 10000
- inputText: "brand"
- extendedWaitUntil:
    visible:
      id: search-files
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: search-frames
    timeout: 10000
- assertNotVisible: ".*Cannot update a component.*"
# The field closes with its ✕; then Designs by its tab.
- tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: tab-designs
    timeout: 10000
- tapOn:
    id: tab-designs
- extendedWaitUntil:
    visible:
      id: designs
    timeout: 10000

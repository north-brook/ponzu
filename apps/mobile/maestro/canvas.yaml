appId: design.ponzu.app.dev
name: canvas
---
# A canvas from its row: the fake's Pricing page, drawn live in the web view
# from the replica on the React Native side, read only. Its name in the title,
# Comment and Chat in the floating stack (unavailable until their slices), no
# pull request yet; then Back to the list.
- runFlow: shared/start.yaml
- openLink: ponzu-dev://dev?seed=signed-in
- extendedWaitUntil:
    visible: "Pricing page, .*site.*"
    timeout: 30000
- tapOn: "Pricing page, .*site.*"
- extendedWaitUntil:
    visible:
      id: canvas
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: canvas-web
    timeout: 15000
# The page has drawn its first page once the placeholder has given way.
- extendedWaitUntil:
    notVisible:
      id: canvas-placeholder
    timeout: 30000
- assertVisible: "Pricing page"
- assertVisible:
    id: stack-comment
- assertVisible:
    id: stack-chat
- assertNotVisible:
    id: stack-pr
- tapOn:
    id: back
- extendedWaitUntil:
    visible:
      id: canvases
    timeout: 10000
- assertNotVisible: ".*Cannot update a component.*"

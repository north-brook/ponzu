appId: design.ponzu.app
name: designs
tags: [dev-host]
---
# The dev host's three examples come up on Designs, under the tab bar's
# Designs, Activity and Search.
- runFlow: shared/start.yaml
- assertVisible:
    id: tab-designs
- assertVisible:
    id: tab-activity
- assertVisible:
    id: tab-search
- scrollUntilVisible:
    element:
      id: card-Kettle
    timeout: 60000
- scrollUntilVisible:
    element:
      id: card-Halon
    timeout: 30000
- scrollUntilVisible:
    element:
      id: card-Weft
    timeout: 30000
- assertNotVisible: ".*Cannot update a component.*"

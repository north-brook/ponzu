<style data-id="n_01c16bn">@keyframes sel { 0%,4% { background:var(--color-tint); border-color:transparent; box-shadow:none } 6%,17% { background:var(--color-panel); border-color:var(--color-ink); box-shadow:0 3px 6px rgba(2,6,23,.15) } 18%,100% { background:var(--color-panel); border-color:var(--color-good); box-shadow:none } }@keyframes dealNew { 0%,60% { opacity:0; transform:translateY(14px) scale(.92) } 68% { opacity:1; transform:translateY(-2px) scale(1.01) } 72%,94% { opacity:1; transform:none } 100% { opacity:0 } }.new { animation: dealNew 3200ms cubic-bezier(0.3,1.3,0.5,1) infinite both }
@keyframes flood { 0%,17% { clip-path: circle(0% at 50% 50%) } 27%,52% { clip-path: circle(80% at 50% 50%) } 100% { clip-path: circle(80% at 50% 50%) } }
@keyframes turn { 0%,52% { transform:scaleX(1); opacity:1 } 60% { transform:scaleX(0); opacity:1 } 61%,100% { opacity:0 } }
.a1 { animation: turn 3200ms cubic-bezier(0.5,0,0.75,0) infinite both }
.a1 > div[data-name^=Card] { animation: sel 3200ms ease-out infinite; position:relative; overflow:hidden }
.a1 .fl { position:absolute; inset:0; background:var(--color-good); border-radius:10px; animation: flood 3200ms cubic-bezier(0.2,0.8,0.2,1) infinite both; display:flex; flex-direction:column; align-items:center; justify-content:center }
.a1 .fl img { filter: brightness(0) invert(1) }</style>

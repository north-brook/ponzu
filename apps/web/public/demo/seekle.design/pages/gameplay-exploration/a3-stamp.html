<style data-id="n_l6veyiz">@keyframes sel { 0%,4% { background:var(--color-tint); border-color:transparent; box-shadow:none } 6%,17% { background:var(--color-panel); border-color:var(--color-ink); box-shadow:0 3px 6px rgba(2,6,23,.15) } 18%,100% { background:var(--color-panel); border-color:var(--color-good); box-shadow:none } }@keyframes dealNew { 0%,60% { opacity:0; transform:translateY(14px) scale(.92) } 68% { opacity:1; transform:translateY(-2px) scale(1.01) } 72%,94% { opacity:1; transform:none } 100% { opacity:0 } }.new { animation: dealNew 3200ms cubic-bezier(0.3,1.3,0.5,1) infinite both }
@keyframes stamp { 0%,18% { opacity:0; transform:scale(1.8) rotate(-20deg) } 23% { opacity:1; transform:scale(.9) rotate(4deg) } 27%,52% { opacity:1; transform:none } 60%,100% { opacity:0 } }
@keyframes sink { 0%,52% { transform:none; opacity:1 } 60%,100% { transform:translateY(10px) scale(.9); opacity:0 } }
.a3 { animation: sink 3200ms ease-in infinite both }
.a3 > div[data-name^=Card] { animation: sel 3200ms ease-out infinite }
.a3 .st { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:999px; background:var(--color-good); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--color-canvas); animation: stamp 3200ms cubic-bezier(0.3,1.4,0.5,1) infinite both; z-index:2 }</style>

.tickflash { animation: tickflash 610ms ease-out both }
/* board.tsx Found: the three stay selected, lift 8pt at 1.05, then fly into the score */
.lifted { transform: translateY(-8px) scale(1.05); position:relative; z-index:1 }
@keyframes beat { 0%,100% { color: var(--color-pink) } 18% { color: var(--color-danger) } }
.beat { animation: beat 1000ms ease-out infinite }
</style>
